# Web search MCP server - YAML configuration (the friendly form of the
# environment variables; see TOOLS.md for the full reference).
#
# The server loads it from --config PATH, or WEB_SEARCH_CONFIG, or a
# gitignored config.yaml placed beside the server file. Values are
# applied onto the process environment; a variable already set in the
# environment wins over this file.

# --- Egress filter (operator-owned) ---
# Both lists live right here, and this file is their live source:
# edits apply on the next call without a restart. Deny wins: a
# blocklisted host is refused even when the allowlist admits it.
# Omit allowlist = every host allowed; omit blocklist = no host blocked.
filter:
  allowlist:
    - example.org        # domain and every subdomain
    - "*.example.net"    # subdomains only
  # blocklist:
  #   - tracker.example  # always refused, same entry format
  # Or point at separate text files (one domain per line, '#'
  # comments, also re-read on change):
  # allowlist_file: /etc/claude/web-allowlist.txt
  # blocklist_file: /etc/claude/web-blocklist.txt
  #
  # SSRF guard (default on): refuses private, loopback, link-local, and
  # cloud-metadata addresses at the address level - IP literals, DNS
  # answers, and redirect targets - regardless of the lists above.
  # Disable ONLY for a deployment that must fetch internal hosts:
  # ssrf_guard: false

# --- Services: provider secrets and the neural pipeline models ---
# secrets carries per-provider api_key blocks, the same shape a KDCube
# deployment's secrets.yaml nests under services:, so the block can be
# carried over verbatim. brave serves the search; anthropic (or
# openai/google) serves the neural pipeline on use_llm=true.
#
# role_models pins the pipeline roles (see TOOLS.md, "The neural
# pipeline"); ``default`` covers every role not pinned. Haiku is the
# intended model class for these roles: fast, cheap, strong enough for
# scoring, filtering, and span extraction. Model ids and prices live in
# the deployment price table (app/ai-app/deployment/economics.yaml).
services:
  secrets:
    brave:
      api_key: ""
    anthropic:
      api_key: ""
    # openai:
    #   api_key: ""
    # google:
    #   api_key: ""
  role_models:
    default:
      provider: anthropic
      model: claude-haiku-4-5-20251001
    tool.source.reconciler:
      provider: anthropic
      model: claude-haiku-4-5-20251001
    tool.sources.filter.by.content:
      provider: anthropic
      model: claude-haiku-4-5-20251001
    tool.sources.filter.by.content.and.segment:
      provider: anthropic
      model: claude-haiku-4-5-20251001

# --- Alternative to individual keys: a KDCube deployment's config ---
# kdcube:
#   assembly_yaml: /path/to/assembly.yaml
#   global_secrets_yaml: /path/to/secrets.yaml

# --- Optional result cache (empty = run without one) ---
cache:
  redis_url: ""
  # ttl_seconds: 3600

