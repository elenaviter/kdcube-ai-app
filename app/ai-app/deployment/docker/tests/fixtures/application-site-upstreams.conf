events {
    worker_connections 32;
}

http {
    access_log off;

    server {
        listen 80;
        default_type text/plain;

        location / {
            return 200 "web-ui:$uri|host=$http_host|xfh=$http_x_forwarded_host|proto=$http_x_forwarded_proto\n";
        }
    }

    server {
        listen 8010;
        default_type text/plain;

        location / {
            return 200 "chat-ingress:$uri|host=$http_host|proto=$http_x_forwarded_proto\n";
        }
    }

    server {
        listen 8020;
        default_type text/plain;

        location / {
            return 200 "chat-proc:$uri|host=$http_host|xfh=$http_x_forwarded_host|proto=$http_x_forwarded_proto\n";
        }
    }

    server {
        listen 8090;
        default_type text/plain;

        location / {
            return 200 "metrics:$uri\n";
        }
    }
}
