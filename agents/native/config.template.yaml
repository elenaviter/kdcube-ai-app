agent:
  max_iterations: 8
  max_tokens: 12000
  topic: "the current stable Python release and its release date"
  cross_conversation_search: true
  instructions:
    profile: lite:core
  additional_instructions: |
    You are a research agent. Use the configured tools for public-web research
    and deliverable creation. Preserve source URLs and follow enabled skills.
  run_directory: ./output
  tools:
    - id: web_tools.web_search
      enabled: true
      runtime: local
      settings:
        filter:
          allowlist:
            - python.org
          blocklist: []
          ssrf_guard: true
        server:
          log_level: WARNING
    - id: exec_tools.execute_code_python
      enabled: true
      runtime: docker
    - id: rendering_tools.write_pdf
      enabled: true
      runtime: local
    - id: rendering_tools.write_docx
      enabled: true
      runtime: local
    - id: rendering_tools.write_pptx
      enabled: true
      runtime: local
  skills:
    root: ./skills
    enabled:
      - demo.research-brief
