agent:
  max_iterations: 8
  max_tokens: 12000
  topic: "the current stable Python release and its release date"
  cross_conversation_search: true
  instructions: |
    You are a research agent. Use the configured tools for public-web research
    and deliverable creation. Preserve source URLs and follow enabled skills.
  run_directory: ./output
  tools:
    - id: demo.web_search
      enabled: true
      runtime: local
      settings:
        filter:
          allowlist:
            - python.org
          blocklist: []
          ssrf_guard: true
        server:
          log_level: WARNING
    - id: demo.create_briefing
      enabled: true
      runtime: local
    - id: exec_tools.execute_code_python
      enabled: false
      runtime: docker
  skills:
    root: ./skills
    enabled:
      - demo.research-brief
