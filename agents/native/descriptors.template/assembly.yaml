context:
  tenant: standalone
  project: agent-harness-native

infra:
  postgres:
    host: 127.0.0.1
    port: 55432
    user: kdcube_agents
    database: kdcube_agents
    postgres_ssl: false
  redis:
    host: 127.0.0.1
    port: 56379
    topology: standalone

storage:
  kdcube: ../output/conversation-store
  workspace:
    type: local
    repo: ""

models:
  default_llm_model_id: claude-haiku-4-5-20251001

secrets:
  provider: secrets-file

platform:
  services:
    proc:
      exec:
        py_code_exec_image: py-code-exec:latest
        py_code_exec_timeout: 600
        py_code_exec_network_mode: none
        py_code_exec_container_strategy: split
        max_file_bytes: 100m
        max_exec_workspace_delta_bytes: 250m
        max_workspace_bytes: 500m
        workspace_monitor_interval_s: 0.5
