agent:
  adapter:
    command: claude
    model: claude-haiku-4-5-20251001
    timeout_seconds: 900
  conversation_id: claude-demo
  topic: "the current stable Python release and its release date"
  instructions: |
    You are a research agent. Work only inside this workspace, preserve source
    URLs, create the requested deliverables, and follow enabled skills.
  run_directory: ./output
  tools:
    - id: Read
      enabled: true
      runtime: local
    - id: Write
      enabled: true
      runtime: local
    - id: Edit
      enabled: true
      runtime: local
    - id: Grep
      enabled: true
      runtime: local
    - id: Glob
      enabled: true
      runtime: local
    - id: Bash
      enabled: true
      runtime: local
    - id: mcp__kdcube_web_search__web_search
      enabled: true
      runtime: local
      settings:
        filter:
          allowlist:
            - python.org
          blocklist: []
          ssrf_guard: true
        server:
          log_level: WARNING
  skills:
    root: ./skills
    enabled:
      - demo.research-brief
