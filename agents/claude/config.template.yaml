claude:
  command: claude
  model: sonnet
  timeout_seconds: 900

agent:
  conversation_id: claude-demo
  topic: "the current stable Python release and its release date"
  instructions: |
    You are a research agent. Work only inside this workspace, preserve source
    URLs, create the requested deliverables, and follow enabled skills.
  tools:
    - id: Read
      enabled: true
      runtime: local
    - id: Write
      enabled: true
      runtime: local
    - id: Edit
      enabled: true
      runtime: local
    - id: Grep
      enabled: true
      runtime: local
    - id: Glob
      enabled: true
      runtime: local
    - id: Bash
      enabled: true
      runtime: local
    - id: WebSearch
      enabled: true
      runtime: local
    - id: WebFetch
      enabled: true
      runtime: local
  skills:
    root: ./skills
    enabled:
      - demo.research-brief

output:
  directory: ./output
