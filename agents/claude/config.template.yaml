claude:
  command: claude
  model: sonnet
  api_key_ref: CLAUDE_CODE_KEY
  timeout_seconds: 900
  allowed_tools:
    - Read
    - Write
    - Edit
    - Grep
    - Glob
    - Bash
    - WebSearch
    - WebFetch

infra:
  postgres:
    host: 127.0.0.1
    port: 55432
    user: kdcube_agents
    database: kdcube_agents
    password_ref: AGENT_DEMO_POSTGRES_PASSWORD
    sslmode: disable
  redis:
    host: 127.0.0.1
    port: 56379
    database: 0
    password_ref: AGENT_DEMO_REDIS_PASSWORD
    turn_cache_ttl_seconds: 3600
  storage:
    uri: ./output/conversation-store

agent:
  topic: "the current stable Python release and its release date"

output:
  directory: ./output
