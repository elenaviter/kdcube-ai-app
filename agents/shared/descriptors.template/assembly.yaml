context:
  tenant: standalone
  project: agent-harness-demo

infra:
  postgres:
    host: 127.0.0.1
    port: 55432
    user: kdcube_agents
    database: kdcube_agents
    postgres_ssl: false
  redis:
    host: 127.0.0.1
    port: 56379
    topology: standalone

storage:
  kdcube: ../output/conversation-store
  workspace:
    type: local
    repo: ""
  claude_code_session:
    type: git
    repo: ../output/claude-session-store.git

models:
  default_llm_model_id: gpt-4o-mini

secrets:
  provider: secrets-file

platform:
  services:
    proc:
      exec:
        py_code_exec_image: py-code-exec:latest
        py_code_exec_timeout: 600
        py_code_exec_network_mode: none
        py_code_exec_container_strategy: split
        max_file_bytes: 100m
        max_exec_workspace_delta_bytes: 250m
        max_workspace_bytes: 500m
        workspace_monitor_interval_s: 0.5

services:
  git:
    git_ssh_key_path: null
    git_ssh_known_hosts: null
    git_ssh_strict_host_key_checking: "yes"
