agent:
  max_tokens: 12000
  recursion_limit: 24
  topic: "the current stable Python release and its release date"
  instructions:
    profile: workspace-files
  additional_instructions: |
    You are a research agent. Use the configured tools for public-web research
    and deliverable creation. Preserve source URLs and follow enabled skills.
  run_directory: ./output
  tools:
    - id: web_search
      enabled: true
      runtime: local
      settings:
        filter:
          allowlist:
            - python.org
          blocklist: []
          ssrf_guard: true
        server:
          log_level: WARNING
    - id: execute_python
      enabled: true
      runtime: docker
    - id: write_pdf
      enabled: true
      runtime: local
    - id: write_docx
      enabled: true
      runtime: local
    - id: write_pptx
      enabled: true
      runtime: local
  skills:
    root: ./skills
    enabled:
      - demo.research-brief
