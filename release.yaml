platform:
  repo: "kdcube-ai-app"
  ref: "2026.07.30.1642"
  description: |
    This release follows 2026.07.29.1625.

    Google Docs joins the productivity integration and named-service surfaces.
    Agents can discover, read, create, edit, format, import, export, comment on,
    and embed images in documents through bounded typed operations or governed
    flexible edits. Access follows the existing two-gate model: the caller
    needs a delegated grant and the user needs the matching connected Google
    account claim; the Google credential remains on the trusted server side.

    MCP clients and servers now support Client ID Metadata Documents from the
    2026-07-28 protocol revision alongside legacy Dynamic Client Registration.
    Registration mode is explicit, existing DCR integrations remain available,
    and the runtime MCP adapters share one compatibility-aware client path.

    OAuth discovery and token revocation now preserve mounted application
    routes. Discovery metadata advertises the served endpoints, and Connection
    Hub exposes the matching revocation route instead of assuming a root mount.

    Browser logout now comes from the same selected Cognito authority provider
    as login. The public frontend configuration returns the matching
    end-session endpoint, preventing a scene configured for one authority from
    attempting logout against another Cognito domain.

    Connection Hub grant recovery now reads nested consent details and served
    recovery URLs. Agent-grant banners retain the requested account and claims,
    then open the precise delegated-access card instead of losing the
    account-specific context.

    Canvas user-text pins now show the full markdown note on the card face and
    support in-place editing. Resizing reveals more of the scrollable note while
    the namespace color remains a compact frame around a neutral reading area.

config:
  version: "2026.07.30.1642"
