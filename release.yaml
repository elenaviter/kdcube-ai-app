platform:
  repo: "kdcube-ai-app"
  ref: "2026.07.25.151"
  description: |
    This release follows 2026.07.20.444.

    Agent and application configuration gains a governed instruction-authoring
    system. Versioned instruction sets are composed from reusable, tagged
    blocks; presentation facets and token projections explain the effective
    prompt before application. Agent Forge and the app/agent configuration
    surfaces support staged edits, assignment, validation, and apply through a
    shared structured contract rather than independent UI-specific formats.

    ReAct runtime correctness is tighter around streamed completion, external
    events, tool contracts, and artifacts. The external-listener ownership race
    is closed, a streamed accepted final answer is no longer duplicated by an
    unnecessary retry, compact tool parameter descriptions remain useful for
    smaller models, and generated artifact references are qualified at their
    source. A current-turn path can be created by react.write once; intentional
    in-place revisions use react.patch and duplicate writes are rejected online
    before replacement content is accepted.

    Telegram turn handling now uses the same framework-neutral runner boundary
    for ReAct, LangGraph, CrewAI, and custom async applications. Bot /stop is the
    standard active-turn event.user.steer control, webhook submission no longer
    relies on process-local conversation ordering, and activity streaming maps
    common chat events into Telegram progress and delivery. File deduplication
    is content-scoped: exact live/final repeats are suppressed while distinct
    same-path snapshots are delivered and documented against the web chat's
    latest-artifact projection.

    Economics and accounting add app-scoped spend, fresh aggregate reads,
    reported-cost pricing, true cost-by-user and cost-by-application reports,
    bounded day-scan processing, and a database index for spend rollups. The
    accompanying documentation links the accounting boundary, emitted records,
    operational reports, and implementation map without overstating coverage.

    Authentication, delegated access, and public project guidance are aligned
    with the runtime. Simple authentication is available as a full Connection
    Hub platform provider, per-account agent bindings remain default-closed with
    guided consent, and architecture/security pages describe the two-gate model.
    README, AGENTS, app-building, agent configuration, accounting, and Telegram
    integration docs now provide clearer discovery paths for people and coding
    agents.
config:
  version: "2026.07.25.151"
