platform:
  repo: "kdcube-ai-app"
  ref: "2026.07.29.450"
  description: |
    This release follows 2026.07.28.210.

    Reactive event lane delivery is hardened around ownership, follow-up
    cancellation, delivery-state locking, and same-conversation turn safety.
    The runtime now preserves and documents the distinction between a turn's
    accepted ingress batch, eligible continuation work, live follow-up, and
    steer events that only affect the active live turn.

    Public content routes now support crawler-style HEAD probes in addition to
    GET. The platform dispatches HEAD through the same public-content handler,
    preserves the GET response status and headers, and returns an empty body so
    sitemap validators and search tooling can verify runtime-generated content
    without receiving the full page or XML payload.

    Connection Hub cleanup is more robust after account disconnects and
    reauthorization. Stale bindings are pruned, grant cards are easier to read,
    dynamic client registration records have a bounded TTL, and agent grant
    cards now name the claim row involved in a requested capability so users can
    understand which access path is being approved.

    The agentic runtime documentation now includes the runtimes map and the
    agent-in-the-runtimes model, with corrected boundary, identity projection,
    scheduled-job, and event-handling semantics. These docs clarify how hosted
    agents, communication runtime, execution isolation, app surfaces, and
    trusted runtime crossings fit together.

config:
  version: "2026.07.29.450"
