platform:
  repo: "kdcube-ai-app"
  ref: "2026.08.03.1350"
  description: |
    This release follows 2026.07.30.1642.

    Google Docs workflows now cover native documents and imported sources from
    discovery through delivery. Agents can copy or convert a source, select
    tabs explicitly, inspect and act on comments, edit and format content, and
    export portable files through the governed productivity and named-service
    surfaces.

    Named-service providers can publish recursive capability catalogs organized
    around domain use cases. Agents can browse a catalog by path, search it by
    intent, and request the exact contract for one object kind or operation
    instead of loading every provider API into the tool catalog. Docs, Sheets,
    Mail, and Slack expose these provider-authored projections.

    Capability lookup supports lexical, semantic, and hybrid search over the
    provider's declarations without indexing user objects. Shared indexes use
    immutable timestamp-and-hash generations derived from the catalog and
    embedding profile. Concurrent loaders converge on one generation, rolling
    deployments retain the current and previous generations, and stale loaders
    cannot prune newer state.

    Delegated operations now re-check current authority at execution time.
    Manual automation access can be created and edited, and newly minted
    credentials are returned reliably on creation. Protected bundle operations
    also receive explicit CSRF validation and provider-surface policy checks.

    Scene hosts can open authorized named-service documents through the
    existing object-action route, preserving provider authorization without
    exposing credentials or introducing an ungoverned download path.

    Descriptor and reference documentation now identifies economics.yaml as
    the sixth default descriptor and points maintenance journals at their
    shared, versioned repository location.

config:
  version: "2026.08.03.1350"
