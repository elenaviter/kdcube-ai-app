platform:
  repo: "kdcube-ai-app"
  ref: "2026.07.27.125"
  description: |
    This release follows 2026.07.27.007.

    The SDK now includes a focused two-level MCP client example for governed
    managed doors. The example shows how a caller reads the first-level consent
    envelope, detects required grants, and then invokes the second-level managed
    service call with the access context that the door returns. This makes the
    delegated-MCP contract easier to test and easier for app builders to copy
    without relying on hidden runtime assumptions.

    Public frontend configuration is decoupled from runtime service internals.
    The control-plane frontend config path now returns only the browser-facing
    contract needed by public shells and embedded widgets, while service/runtime
    values stay server-side. Regression coverage was added for the public
    frontend config response so route prefixes, tenant/project identity, and
    public app configuration remain stable without leaking implementation-only
    settings.

config:
  version: "2026.07.27.125"
