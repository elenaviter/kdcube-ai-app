platform:
  repo: "kdcube-ai-app"
  ref: "2026.08.18.242"
  description: |
    This release follows 2026.08.15.310.

    Hosted agent runtimes now have a complete live-control path without giving
    the platform ownership of their execution loops. A lane-neutral watcher
    delivers steer and stop signals to the active runtime; the ported
    LangGraph adapter cancels the active stream while preserving its
    checkpoint, and the Claude Code adapter receives the same controls through
    its runtime hook. Live-control state is stored outside restored Claude Code
    session checkouts so stale stop state cannot return with a recovered
    workspace.

    Interrupted LangGraph tool calls are repaired as truthful tool results
    attributed to the tools node. This closes dangling tool-call protocol
    edges, lets an already stopped thread resume, and keeps interruption facts
    in the persisted framework state rather than silently rebuilding or
    rerunning the turn.

    Conversation event-lane ownership is stricter. New arrivals are measured
    against the events present when the turn started, and a watcher heartbeat
    may refresh only a reservation already owned by that watcher. A heartbeat
    can no longer claim a reservation or promote a consumer to active. Hosted
    runtime event folding, reload, stream recording, answer recording, and
    recovery now follow the same shared conversation contracts.

    Delegated MCP feedback and named-service file delivery have been corrected
    across hosted runtimes. Governed tool outcomes remain visible to the agent,
    and file uploads are represented through the conversation delivery path
    rather than being lost at a framework boundary.

    Git-backed app materialization now treats sparse checkout as a caller-owned
    decision. The bundle store reads descriptor arguments instead of process
    environment, fetches only the configured package folder when sparse mode is
    requested, and retains a full-clone fallback for repositories that cannot
    satisfy the optimized path.

    Conversation-title generation has a larger bounded output budget and now
    reports when that ceiling truncates a title. Default descriptors no longer
    include private press configuration, and the press app descriptor and docs
    use the current package identity.

    Repository hygiene removes accidentally tracked conversation-debug dumps,
    runtime identity-store copies, and generated dashboard siblings. Canonical
    TypeScript frontend sources remain in place, and narrow ignore rules keep
    these local or generated artifacts out of future releases.

config:
  version: "2026.08.18.242"
