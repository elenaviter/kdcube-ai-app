platform:
  repo: "kdcube-ai-app"
  ref: "2026.07.27.1240"
  description: |
    This release follows 2026.07.27.125.

    Static widget deployment now has an explicit authorized predeployment path.
    Proc startup can coordinate widget builds through the app-deployment
    subsystem, persist deployment metadata, and serve predeployed widget
    artifacts through the platform runtime instead of rebuilding them on every
    request path. This gives hosted apps a clearer operational boundary between
    source app loading, widget build coordination, and runtime delivery.

    The widget serving path now enforces authorization policy for deployed
    static artifacts. Integration routes can resolve and return previously
    deployed widget files while preserving role and visibility checks, and new
    tests cover deployed static widget access, app deployment storage,
    deployment modes, and the startup preload lock behavior.

config:
  version: "2026.07.27.1240"
