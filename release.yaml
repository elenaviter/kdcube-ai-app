platform:
  repo: "kdcube-ai-app"
  ref: "2026.08.19.120"
  description: |
    This release follows 2026.08.18.242.

    Application startup now uses a supervised, generation-aware preparation
    lifecycle. Each application independently resolves and loads its source,
    runs on_bundle_load(), prepares declared UI surfaces, runs the fenced
    on_app_deploy() hook, and publishes readiness. Failed preparation retries
    with backoff, and a newer generation supersedes stale work. Applications
    can therefore complete long initialization at their own pace while the
    processor continues serving ready applications.

    Health and admission are explicit deployment-neutral contracts.
    /health/live reports processor liveness; /health reports aggregate service
    readiness and includes only applications configured with
    service.readiness: required. Every REST, MCP, chat, Data Bus, scheduled-job,
    and internal operation checks the addressed application generation before
    execution. Interactive doors return a structured application_not_ready
    response, while queued work is deferred for retry. The same contracts apply
    under Docker Compose, ECS, and Kubernetes probes.

    ReAct artifact recovery now enforces current-turn locality consistently.
    Conversation-file and external artifacts must be present in the current
    ANNOUNCE LOCAL set or materialized during the active turn before file
    processing. Logical URI references remain distinct from physical workspace
    paths, timeline references remain directly readable, and canvas-owned
    materialized artifacts retain their content. Bounded inspection and the
    thinking instances used by timeline rendering are preserved across rounds.

    Full and compact ReAct tool catalogs now serialize structured purpose,
    return, and example contracts as deterministic JSON, preserving nested MCP
    schemas in model instructions. The shipped Workspace configuration uses
    compact catalog forms, the extra-lite instruction profile, and its
    configured Haiku decision model as coherent serving defaults.

    Hosted-agent documentation now defines effective-turn and event-lane
    ownership for external execution loops. The LangGraph agent surface covers
    per-turn graph construction, framework-owned checkpoints, model accounting,
    and stopped tool-call repair. The Claude Code conversation recipe records
    truthful lane folding, refusal, stream capture, and stop reconciliation.

    Fresh installation descriptors select the application-hosted Google
    session authority through Connection Hub and align the default application
    inventory, governed named-service catalog, scene, and CLI recommendation.
    The default platform descriptor is pinned to the previous published
    platform release as its installation baseline.

config:
  version: "2026.08.19.120"
